[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitzy-backend"
version = "0.1.0"
description = "FastAPI backend for Splitzy - AI-powered expense sharing & UPI settlement"
authors = [{ name = "Hitesh Shimpi", email = "hiteshshimpi45@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "supabase>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "google-genai>=0.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
